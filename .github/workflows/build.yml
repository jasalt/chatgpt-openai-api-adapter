name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go mod tidy

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o chatgpt-openai-api-adapter-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-openai-api-adapter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: chatgpt-openai-api-adapter-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chatgpt-openai-api-adapter-linux-amd64/chatgpt-openai-api-adapter-linux-amd64
            chatgpt-openai-api-adapter-linux-arm64/chatgpt-openai-api-adapter-linux-arm64
            chatgpt-openai-api-adapter-darwin-arm64/chatgpt-openai-api-adapter-darwin-arm64
